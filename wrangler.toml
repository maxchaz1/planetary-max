name = "planetary-max"
main = "src/index.ts"
compatibility_date = "2026-11-07"

[vars]
PLANETARY_MODE = "single"
UMBRELLA_ENFORCEMENT = "strict"
MAX_OS_VERSION = "1"
PORTAL_OS_PHASE = "11"
KERNEL_TIMEOUT_MS = "5000"
SUBSTRATE_TIMEOUT_MS = "3000"
MAX_RETRY_ATTEMPTS = "3"
RETRY_BASE_DELAY_MS = "50"
CIRCUIT_FAILURE_THRESHOLD = "5"
CIRCUIT_COOLDOWN_MS = "30000"

[[d1_databases]]
binding = "DB"
database_name = "planetary-max-dbplanetary-max-db"
database_id = "8794f674-7402-4f4f-93af-7da6a5ea5a8f"
migrations_dir = "migrations"

[[services]]
binding = "KERNEL_SERVICE"
service = "kernel-core"

[[services]]
binding = "MAX_OS_1"
service = "portal-os-1"

[build]
command = "npm run build"
